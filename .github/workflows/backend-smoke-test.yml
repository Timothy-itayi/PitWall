name: Backend smoke test

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/backend-smoke-test.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/backend-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Install and import Azure Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Parse and import backend modules
        run: npm run check

      - name: Run tests when present
        run: npm test --if-present
